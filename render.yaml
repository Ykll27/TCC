services:
  - type: web
    name: atlas
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MODELO_GEMINI
        value: gemini-2.0-flash
      # Configure DATABASE_URL no painel do Render apontando para PostgreSQL.
      # Não coloque usuário/senha do banco direto no GitHub.
